name: Tests (non-blocking)

# Safety net (code-review 2026-11-08, Top 10 #1). Runs tsc --noEmit and the jest suite on every push to master.
# This workflow is independent of unified-workflow.yml: nothing there needs it, so a red run here NEVER blocks or
# delays the build/publish. It only reports.

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npx jest --silent --maxWorkers=2
